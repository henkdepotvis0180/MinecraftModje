plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}
version = '0.1.0'
group = 'nl.henk'
base { archivesName = 'henk-helpers' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
neoForge {
    version = '21.1.172'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { henkhelpers { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.register('coreTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'nl.henk.helpers.CoreTest'
}
tasks.named('check') { dependsOn tasks.named('coreTest') }

tasks.register('chatTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'nl.henk.helpers.ChatTest'
    jvmArgs '--add-modules', 'jdk.httpserver'
}
tasks.named('check') { dependsOn tasks.named('chatTest') }
