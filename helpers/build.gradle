plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}
version = '0.3.0'
group = 'nl.henk'
base { archivesName = 'henk-helpers' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies { testImplementation 'com.google.code.gson:gson:2.10.1' }
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
neoForge {
    version = '21.1.172'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'henkhelpers'
        }
    }
    mods { henkhelpers {
        sourceSet sourceSets.main
        if (project.hasProperty('gameTests')) sourceSet sourceSets.gameTest
    } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.register('coreTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'nl.henk.helpers.CoreTest'
}
tasks.named('check') { dependsOn tasks.named('coreTest') }

tasks.register('chatTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'nl.henk.helpers.ChatTest'
    jvmArgs '--add-modules', 'jdk.httpserver'
}
tasks.named('check') { dependsOn tasks.named('chatTest') }

// Explicit opt-in: normal builds do not require Ollama or download a model.
tasks.register('liveChatTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'nl.henk.helpers.LiveChatTest'
}
